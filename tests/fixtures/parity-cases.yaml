# Edge cases BOTH parsers must agree on. Known divergences (quoted '#' inside
# values, duplicate section headers, flat-style lists, non-2-space indent) are
# tracked in docs/reviews/2026-07-03-comprehensive-review.md and stay excluded
# until fixed — add each here as its fix lands.
general:
  plain: value
  with_comment: value2  # inline comment
  quoted_double: "hello world"
  quoted_single: 'single quoted'
  number: 42
  bool_true: true
lists:
  simple:
    - one
    - two
  single:
    - only
  after_list: back-to-scalar
nested:
  level_two:
    deep_key: deep-value
