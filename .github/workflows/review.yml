name: PR Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  shellcheck-review:
    name: ShellCheck Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck with reviewdog
        uses: reviewdog/action-shellcheck@v1
        with:
          reporter: github-pr-review
          shellcheck_flags: "-x"
          pattern: "*.sh"
          path: "."
          fail_on_error: false

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          fail_on_error: false

  # (test-summary job removed: it re-ran the full bash suite that ci.yml's
  # Unit Tests job already runs, and its PR comment step 403'd on forked
  # PRs. The Unit Tests check is the single source of truth.)
